<!DOCTYPE html>
<html>
<head>
  <title>Clearway</title>
  <meta charset="utf-8"/>
  <link rel="stylesheet" href="/SCSS/common.css"/>
  <link rel="stylesheet" href="ClearwayPanel.css"/>
  <script type="text/javascript" src="/JS/coherent.js"></script>
  <script type="text/javascript" src="/JS/common.js"></script>
  <script type="text/javascript" src="/JS/dataStorage.js"></script>
  <script type="text/javascript" src="/JS/simvar.js"></script>
  <script type="text/javascript" src="/JS/Services/ToolBarPanels.js"></script>
  <link rel="import" href="/templates/ingameUi/ingameUi.html"/>
  <link rel="import" href="/templates/ingameUiHeader/ingameUiHeader.html"/>
</head>
<body class="border-box">
  <ingamepanel-clearway>
    <ingame-ui id="ClearwayPanel" panel-id="PANEL_CLEARWAY" title="" class="ingameUiFrame"
               isPanelCloseable="false" collapsible="false" noBackground="true" handlebygame="true"
               resize="none" auto-inside="" is-transparent>
      <div id="cw-root">
        <!-- drag capture layer, only active while dragging -->
        <div id="cw-capture"></div>

        <!-- floating icon: vPilot count on the left, CPDLC count on the right -->
        <div id="cw-bubble" class="offline" title="Clearway">
          <svg viewBox="0 0 24 24" class="cw-glyph"><path d="M12 3.6c-4.7 0-8.5 3.3-8.5 7.4 0 2.2 1.1 4.2 3 5.6L6 20l4-1.9c.6.1 1.3.2 2 .2 4.7 0 8.5-3.3 8.5-7.4S16.7 3.6 12 3.6z"/></svg>
          <span class="cw-ndot vp hidden" id="cw-ndot-vp"></span>
          <span class="cw-ndot cp hidden" id="cw-ndot-cp"></span>
        </div>

        <!-- expanded card -->
        <div id="cw-card" class="hidden">
          <div class="cw-head" id="cw-head">
            <div class="cw-tabs">
              <div class="cw-tab" data-tab="vpilot">vPilot<span class="cw-tdot vp hidden" id="cw-tdot-vp"></span></div>
              <div class="cw-tab" data-tab="cpdlc">CPDLC<span class="cw-tdot cp hidden" id="cw-tdot-cp"></span></div>
            </div>
            <div class="cw-icon-btn" id="cw-notes-btn" title="Notepad">
              <svg viewBox="0 0 24 24"><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5M8.5 13h7M8.5 16.5h4.5"/></svg>
            </div>
            <div class="cw-icon-btn" id="cw-min" title="Collapse">
              <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
            </div>
          </div>

          <!-- ======================= vPilot ======================= -->
          <div id="cw-pane-vpilot" class="cw-pane hidden">
            <div class="cw-bar">
              <span class="cw-dot" id="cw-vp-dot"></span>
              <span class="cw-bar-title" id="cw-vp-cs">vPilot</span>
              <div class="cw-mini" id="cw-vp-sby" title="Transponder standby">SBY</div>
              <div class="cw-mini" id="cw-vp-c" title="Transponder Mode C">C</div>
              <div class="cw-mini" id="cw-vp-id" title="Squawk ident">ID</div>
              <div class="cw-mini wide" id="cw-vp-conn">Connect</div>
            </div>
            <div class="cw-vp-connect hidden" id="cw-vp-connect">
              <div class="cw-fields">
                <input id="cw-vp-cs-in" class="cw-input cw-field third" type="text" placeholder="Callsign"/>
                <input id="cw-vp-type-in" class="cw-input cw-field third" type="text" placeholder="Type"/>
                <input id="cw-vp-selcal-in" class="cw-input cw-field third" type="text" placeholder="SELCAL"/>
              </div>
              <div class="cw-btn primary full" id="cw-vp-connect-go">Connect to VATSIM</div>
            </div>
            <div class="cw-chips" id="cw-vp-chips"></div>
            <div class="cw-com-pop hidden" id="cw-com-pop"></div>
            <div class="cw-list cw-chat" id="cw-vp-chat"></div>
            <div class="cw-list hidden" id="cw-vp-atc"></div>
            <div class="cw-compose">
              <div class="cw-row">
                <textarea id="cw-vp-input" class="cw-input plain cw-grow" rows="1" placeholder="Message, or a .command"></textarea>
                <div class="cw-btn primary" id="cw-vp-send">Send</div>
              </div>
              <div class="cw-hint" id="cw-vp-hint"></div>
            </div>
          </div>

          <!-- ======================= CPDLC ======================= -->
          <div id="cw-pane-cpdlc" class="hidden">
            <div class="cw-bar">
              <span class="cw-dot" id="cw-dot"></span>
              <span class="cw-bar-title" id="cw-callsign">Clearway</span>
              <span class="cw-pill hidden" id="cw-unit"></span>
              <div class="cw-icon-btn" id="cw-clear" title="Clear old messages">
                <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 12.5h9l1-12.5M10 11v5M14 11v5"/></svg>
              </div>
            </div>
            <div class="cw-notice hidden" id="cw-notice"></div>
            <div class="cw-list" id="cw-list"></div>
            <div class="cw-section">
              <div class="cw-section-head" id="cw-req-toggle">
                <span>Request</span><span class="cw-chev" id="cw-req-chev"></span>
              </div>
              <div class="cw-section-body hidden" id="cw-req">
                <div class="cw-seg" id="cw-req-kind">
                  <div class="cw-seg-btn on" data-v="logon">Logon</div>
                  <div class="cw-seg-btn" data-v="level">Level</div>
                  <div class="cw-seg-btn" data-v="direct">Direct</div>
                  <div class="cw-seg-btn" data-v="text">Text</div>
                </div>
                <div class="cw-seg" id="cw-req-kind2">
                  <div class="cw-seg-btn" data-v="pdc">Clearance</div>
                  <div class="cw-seg-btn" data-v="oceanic">Oceanic</div>
                  <div class="cw-seg-btn" data-v="telex">Telex</div>
                  <div class="cw-seg-btn" data-v="wx">WX</div>
                </div>
                <div class="cw-seg hidden" id="cw-wx-kind">
                  <div class="cw-seg-btn on" data-v="metar">METAR</div>
                  <div class="cw-seg-btn" data-v="taf">TAF</div>
                  <div class="cw-seg-btn" data-v="vatatis">ATIS</div>
                </div>
                <div class="cw-fields" id="cw-fields"></div>
                <div class="cw-row cw-send-row">
                  <div class="cw-hint" id="cw-hint"></div>
                  <div class="cw-btn primary" id="cw-send">Send</div>
                </div>
              </div>
            </div>
          </div>

          <!-- ======================= notepad ======================= -->
          <div id="cw-notes" class="hidden">
            <textarea id="cw-notes-text" class="cw-notes" placeholder="Notes: frequencies, clearances, squawk codes…"></textarea>
            <div class="cw-hint" id="cw-notes-state"></div>
          </div>
        </div>
      </div>
    </ingame-ui>
  </ingamepanel-clearway>
  <script type="text/javascript" src="ClearwayPanel.js"></script>
</body>
</html>
