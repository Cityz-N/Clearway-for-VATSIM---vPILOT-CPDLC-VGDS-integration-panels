name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Clearway companion
        run: |
          pip install pyinstaller==6.11.1
          python tools/build_exe.py

      - name: Package MSFS panel
        shell: pwsh
        run: |
          if (Test-Path msfs-panel/compiled/clearway-panel.spb) {
            python tools/build_panel.py --assemble
            Compress-Archive -Path dist/clearway-panel -DestinationPath clearway-panel.zip
          } else {
            Write-Warning "msfs-panel/compiled/clearway-panel.spb not committed - skipping the panel. Run tools/build_panel.py locally first."
          }

      - name: Package vPilot plugin
        shell: pwsh
        run: |
          if (Test-Path vpilot-plugin/compiled/Clearway.vPilot.dll) {
            Compress-Archive -Path vpilot-plugin/compiled/Clearway.vPilot.dll -DestinationPath clearway-vpilot-plugin.zip
          }

      - name: All-in-one zip (Community folder + companion + vPilot plugin)
        shell: pwsh
        run: |
          if ((Test-Path msfs-panel/compiled/clearway-panel.spb) -and (Test-Path vpilot-plugin/compiled/Clearway.vPilot.dll)) {
            python tools/make_release_zip.py
          }
          Compress-Archive -Path dist/Clearway -DestinationPath Clearway-companion.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Clearway-for-VATSIM-*.zip
            Clearway-companion.zip
            clearway-panel.zip
            clearway-vpilot-plugin.zip
          fail_on_unmatched_files: false
          generate_release_notes: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clearway
          path: |
            dist/Clearway-for-VATSIM-*.zip
            Clearway-companion.zip
            clearway-panel.zip
            clearway-vpilot-plugin.zip
          if-no-files-found: warn
