name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Clearway.exe
        working-directory: companion
        run: |
          pip install pyinstaller==6.11.1
          pyinstaller --onefile --name Clearway --noconsole --icon web/clearway.ico --add-data "web;web" clearway_app.py

      - name: Package MSFS panel
        shell: pwsh
        run: |
          if (Test-Path msfs-panel/compiled/clearway-panel.spb) {
            python tools/build_panel.py --assemble
            Compress-Archive -Path dist/clearway-panel -DestinationPath clearway-panel.zip
          } else {
            Write-Warning "msfs-panel/compiled/clearway-panel.spb not committed - skipping the panel. Run tools/build_panel.py locally first."
          }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            companion/dist/Clearway.exe
            clearway-panel.zip
          fail_on_unmatched_files: false
          generate_release_notes: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clearway
          path: |
            companion/dist/Clearway.exe
            clearway-panel.zip
          if-no-files-found: warn
