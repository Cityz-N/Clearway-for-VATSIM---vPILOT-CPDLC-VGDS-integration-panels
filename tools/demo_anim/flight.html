<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clearway demo flight</title>
<!-- Scripted demo flight used by tools/record_demo.py to record the panel animation.
     The real panel runs in the iframe against the test Clearway (tools/dev_run.py, port 8797);
     this page only draws the cockpit view, moves a fake cursor and plays the script. -->
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: "Segoe UI Variable", "Segoe UI", sans-serif; }
  .scene { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
  .scene.on { opacity: 1; }

  /* ---------- gate at dusk ---------- */
  #gate { background: linear-gradient(180deg, #0f1c36 0%, #2a3f68 30%, #8a6a7a 40%, #e09a62 44%, #3a3236 44.4%, #26262a 60%, #1c1c1f 100%); }
  #gate .terminal { position: absolute; left: 0; width: 1920px; top: 352px; height: 128px; background: #15171c; }
  #gate .terminal::before { content: ""; position: absolute; left: 40px; right: 40px; top: 30px; height: 40px;
    background: repeating-linear-gradient(90deg, rgba(255, 214, 150, .75) 0 26px, transparent 26px 38px); opacity: .55; }
  #gate .terminal::after { content: ""; position: absolute; left: 0; right: 0; top: -14px; height: 14px; background: #1b1e24; }
  #gate .bridge { position: absolute; left: 610px; top: 420px; width: 360px; height: 34px; background: #2a2d34; transform: skewY(9deg); transform-origin: 0 0; box-shadow: inset 0 -6px 0 #1c1e23; }
  #gate .line { position: absolute; left: 300px; top: 480px; width: 900px; height: 600px; border-left: 5px solid #d9b13b; border-radius: 40% 0 0 0; opacity: .7; transform: perspective(500px) rotateX(55deg); transform-origin: 50% 0; }

  /* ---------- runway 27R ---------- */
  #rwy { background: linear-gradient(180deg, #13223f 0%, #33507e 28%, #b78a7a 40%, #f0a868 43.4%, #2a2c25 43.6%, #1e211b 62%, #15170f 100%); }
  #rwy .runway { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #3a3b3e;
    clip-path: polygon(505px 470px, 545px 470px, 1060px 1080px, -30px 1080px); }
  #rwy .centre { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    background: repeating-linear-gradient(180deg, #f2f2f2 0 22px, transparent 22px 52px);
    clip-path: polygon(523px 474px, 527px 474px, 535px 1080px, 505px 1080px); opacity: .85; }
  #rwy .light { position: absolute; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff3c4; box-shadow: 0 0 8px 3px rgba(255, 228, 160, .7); }

  /* ---------- oceanic cruise ---------- */
  #cruise { background: linear-gradient(180deg, #08173a 0%, #1a3f7c 30%, #5d8fc8 45%, #a9c8e6 49%, #dfe9f3 50%, #c6d3e2 60%, #9fb1c6 100%); }
  #cruise .sun { position: absolute; left: 820px; top: 230px; width: 360px; height: 360px; margin: -180px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 252, 235, 1) 0 6%, rgba(255, 240, 200, .5) 14%, transparent 60%); }
  #cruise .cloud { position: absolute; border-radius: 50%; background: radial-gradient(ellipse, rgba(255, 255, 255, .95), rgba(232, 238, 246, .4) 55%, transparent 70%); }

  /* ---------- cockpit frame ---------- */
  .glare { position: absolute; left: -100px; right: -100px; top: 676px; height: 500px; background: #0b0c0f; border-radius: 50% 50% 0 0 / 60px 60px 0 0; box-shadow: 0 -2px 0 #23262d; }
  .pillar { position: absolute; left: 968px; top: 100px; width: 90px; height: 700px; background: linear-gradient(90deg, #121318, #07080a); transform: skewX(-9deg); }
  .brand { position: absolute; left: 650px; top: 166px; width: 300px; text-align: right; color: #fff; font-size: 17px; font-weight: 600; letter-spacing: .3px; text-shadow: 0 1px 6px rgba(0,0,0,.6); opacity: .9; }
  .brand span { color: #00d8d4; }
  #caption { position: absolute; left: 466px; top: 680px; white-space: nowrap; padding: 7px 15px; border-radius: 18px;
    background: rgba(8, 12, 20, .78); color: #fff; font-size: 15.5px; border: 1px solid rgba(255,255,255,.12); transition: opacity .35s; }
  #caption b { color: #00d8d4; font-weight: 600; }

  #panel { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; background: transparent; }

  /* ---------- fake cursor ---------- */
  #cursor { position: absolute; left: 0; top: 0; width: 22px; height: 30px; z-index: 10; pointer-events: none; }
  .ripple { position: absolute; width: 36px; height: 36px; margin: -18px; border-radius: 50%; border: 3px solid #fff; z-index: 9; pointer-events: none; animation: rip .55s ease-out forwards; }
  .ripple.right { border-color: #f5b14c; }
  @keyframes rip { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  .rlabel { position: absolute; z-index: 9; color: #f5b14c; font: 600 13px "Segoe UI", sans-serif; text-shadow: 0 1px 4px #000; pointer-events: none; }
</style>
</head>
<body>
  <div class="scene on" id="gate"><div class="terminal"></div><div class="bridge"></div><div class="line"></div></div>
  <div class="scene" id="rwy"><div class="runway"></div><div class="centre"></div></div>
  <div class="scene" id="cruise"><div class="sun"></div></div>
  <div class="pillar"></div>
  <div class="glare"></div>
  <div class="brand">Clearway <span>for VATSIM</span></div>
  <iframe id="panel"></iframe>
  <div id="caption" style="opacity:0"></div>
  <svg id="cursor" viewBox="0 0 22 30"><path d="M2 2v22l6-5.5 4 9 3.6-1.6-4-8.8H19z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>

<script>
"use strict";
var API = "http://localhost:8797/api/";

// ---- scenery ----
(function () {
  var rwy = document.getElementById("rwy");
  for (var i = 0; i < 26; i++) {                       // edge lights, closer together in the distance
    var t = Math.pow(i / 25, 1.8), y = 472 + t * 620;
    [[505, -30], [545, 1060]].forEach(function (e) {
      var d = document.createElement("div");
      d.className = "light";
      d.style.left = (e[0] + (e[1] - e[0]) * t) + "px";
      d.style.top = y + "px";
      d.style.transform = "scale(" + (0.4 + t * 1.6) + ")";
      rwy.appendChild(d);
    });
  }
  var cr = document.getElementById("cruise");
  [[80, 560, 520, 120], [420, 600, 700, 160], [-60, 650, 600, 200], [700, 545, 520, 90], [300, 520, 420, 70], [600, 700, 800, 260]].forEach(function (c) {
    var d = document.createElement("div");
    d.className = "cloud";
    d.style.left = c[0] + "px"; d.style.top = c[1] + "px"; d.style.width = c[2] + "px"; d.style.height = c[3] + "px";
    cr.appendChild(d);
  });
})();

function scene(id) {
  ["gate", "rwy", "cruise"].forEach(function (s) { document.getElementById(s).classList.toggle("on", s === id); });
}
function caption(html) {
  var c = document.getElementById("caption");
  c.style.opacity = 0;
  return wait(350).then(function () { c.innerHTML = html; c.style.opacity = html ? 1 : 0; });
}

// ---- helpers ----
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function api(path, body) {
  return fetch(API + path, body === undefined ? {} : { method: "POST", body: JSON.stringify(body) }).then(function (r) { return r.json(); });
}
var doc = null;
function $(sel) { return doc.querySelector(sel); }
function waitFor(sel, ms) {
  var end = Date.now() + (ms || 6000);
  return new Promise(function (res, rej) {
    (function check() {
      var e = typeof sel === "function" ? sel() : $(sel);
      if (e && (e.offsetWidth || e.offsetHeight)) return res(e);
      if (Date.now() > end) return rej(new Error("not found: " + sel));
      setTimeout(check, 60);
    })();
  });
}

var cur = { x: 760, y: 560 };
function placeCursor() { var c = document.getElementById("cursor"); c.style.left = (cur.x - 2) + "px"; c.style.top = (cur.y - 2) + "px"; }
function centre(e, dx, dy) { var r = e.getBoundingClientRect(); return { x: r.left + r.width / 2 + (dx || 0), y: r.top + r.height / 2 + (dy || 0) }; }
function moveTo(target, ms) {
  var to = target.nodeType ? centre(target) : target, from = { x: cur.x, y: cur.y }, t0 = performance.now();
  ms = ms || 650;
  return new Promise(function (res) {
    (function step(now) {
      var k = Math.min(1, (now - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      cur.x = from.x + (to.x - from.x) * e; cur.y = from.y + (to.y - from.y) * e;
      placeCursor();
      if (k < 1) requestAnimationFrame(step); else res();
    })(t0);
  });
}
function ripple(right) {
  var r = document.createElement("div");
  r.className = "ripple" + (right ? " right" : "");
  r.style.left = cur.x + "px"; r.style.top = cur.y + "px";
  document.body.appendChild(r);
  setTimeout(function () { r.remove(); }, 700);
  if (right) {
    var l = document.createElement("div");
    l.className = "rlabel"; l.textContent = "right click";
    l.style.left = (cur.x + 18) + "px"; l.style.top = (cur.y + 16) + "px";
    document.body.appendChild(l);
    setTimeout(function () { l.remove(); }, 1300);
  }
}
function mouse(e, type, button) {
  var p = centre(e);
  e.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, button: button || 0, clientX: p.x, clientY: p.y, view: doc.defaultView }));
}
function click(e) { ripple(false); mouse(e, "mousedown"); mouse(e, "mouseup"); mouse(e, "click"); return wait(120); }
function clickBubble(e) { ripple(false); mouse(e, "mousedown"); doc.dispatchEvent(new MouseEvent("mouseup", { bubbles: true })); return wait(120); }
function rightClick(e) { ripple(true); mouse(e, "mousedown", 2); mouse(e, "contextmenu", 2); return wait(120); }
function go(sel, ms) { return waitFor(sel).then(function (e) { return moveTo(e, ms).then(function () { return e; }); }); }
// look the element up again after moving: lists like the chat chips are redrawn every second, and a click on
// the element found before the move would land on a node that's no longer on screen
function goClick(sel, ms) { return go(sel, ms).then(function (e) { return click((typeof sel === "string" && $(sel)) || e); }); }
function type(e, text, cps) {
  e.focus();
  var i = 0;
  return new Promise(function (res) {
    (function next() {
      if (i >= text.length) return res();
      e.value += text[i++];
      e.dispatchEvent(new Event("input", { bubbles: true }));
      setTimeout(next, 1000 / (cps || 16) * (0.6 + Math.random() * 0.8));
    })();
  });
}
function fill(id, text) { return goClick("#" + id, 380).then(function () { var e = $("#" + id); e.value = ""; return type(e, text, 18); }); }
function radio(text) { return api("vpilot/event", { type: "radio", from: "EGLL_TWR", message: text, frequencies: "118.500" }); }

// ---- stand-in for the sim: your aircraft for the radar (?me=lat,lon from record_demo.py), the radios ----
var ME = (function () { var m = /[?&]me=(-?[\d.]+),(-?[\d.]+)/.exec(location.search); return m ? { lat: +m[1], lon: +m[2] } : null; })();
var meT0 = Date.now();
function installSim(w) {
  w.SimVar = {
    GetSimVarValue: function (n) {
      var dt = (Date.now() - meT0) / 1000;
      if (ME && n === "PLANE LATITUDE") return ME.lat + dt * 0.0011;            // heading about 315, ~400 kt
      if (ME && n === "PLANE LONGITUDE") return ME.lon - dt * 0.0013;
      if (n === "PLANE HEADING DEGREES TRUE") return 315;
      if (n === "PLANE ALTITUDE") return 34000;
      if (n === "GROUND VELOCITY") return 420;
      if (n.indexOf("COM ACTIVE FREQUENCY:1") === 0) return 118.5;
      if (n.indexOf("COM STANDBY FREQUENCY:1") === 0) return 121.975;
      if (n.indexOf("COM ACTIVE FREQUENCY:2") === 0) return 121.5;
      if (n.indexOf("COM STANDBY FREQUENCY:2") === 0) return 122.8;
      if (n.indexOf("COM TRANSMIT:1") === 0 || n.indexOf("COM RECEIVE:1") === 0) return 1;
      if (n.indexOf("TRANSPONDER STATE") === 0) return 4;
      return 0;
    },
    SetSimVarValue: function () { return { then: function () {} }; }
  };
}

// ---- radar helpers: screen position of a lat/lon (same projection as radar.js) ----
function project(lat, lon) {
  var v = JSON.parse(localStorage.getItem("radar.view")), r = $("#rd-map").parentNode.getBoundingClientRect();
  var s = Math.sin(lat * Math.PI / 180), mx = (lon + 180) / 360, my = 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
  var ws = 256 * Math.pow(2, v.z);
  return { x: r.left + r.width / 2 + (mx - v.x) * ws, y: r.top + r.height / 2 + (my - v.y) * ws, r: r };
}
function inside(p, m) { return p.x > p.r.left + (m || 70) && p.x < p.r.right - (m || 70) && p.y > p.r.top + 50 && p.y < p.r.bottom - 50; }
function planeOnScreen() {
  return api("radar/traffic").then(function (t) {
    var best = null, bd = 1e9;
    (t.pilots || []).forEach(function (pl) {
      if (pl[3] < 1000) return;
      var p = project(pl[1], pl[2]), cx = p.r.left + p.r.width / 2, cy = p.r.top + p.r.height / 2;
      var d = Math.pow(p.x - cx - 60, 2) + Math.pow(p.y - cy, 2);
      if (inside(p, 220) && d < bd) { bd = d; best = p; }
    });
    return best;
  });
}
function atcOnScreen() {
  return api("radar/atc").then(function (a) {
    var best = null, bd = 1e9;
    (a.airports || []).forEach(function (ap) {
      if (!ap.c || !ap.c.length) return;
      var p = project(ap.lat, ap.lon), cx = p.r.left + p.r.width / 2, cy = p.r.top + p.r.height / 2;
      var d = Math.pow(p.x - cx, 2) + Math.pow(p.y - cy, 2);
      if (inside(p, 230) && d < bd) { bd = d; best = p; }
    });
    return best;
  });
}
// a click on the map: whichever canvas is in front gets the press, the window the release (as radar.js expects)
function mapClick(p) {
  if (!p) return wait(300);
  ripple(false);
  var t = doc.elementFromPoint(p.x, p.y) || $("#rd-map");
  t.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true, button: 0, clientX: p.x, clientY: p.y, view: doc.defaultView }));
  t.dispatchEvent(new MouseEvent("mouseup", { bubbles: true, cancelable: true, button: 0, clientX: p.x, clientY: p.y, view: doc.defaultView }));
  return wait(150);
}
function mockFp(status) { return fetch("http://127.0.0.1:8790/fp?set=" + status, { mode: "no-cors" }).catch(function () {}); }

// ---- the flight, in the order of the tabs: vPilot, CPDLC, SELCAL, Radar ----
function flight() {
  var code = "";
  return Promise.resolve()
    // ======== 1. vPilot ========
    .then(function () { return wait(900); })
    .then(function () { return caption("<b>vPilot</b> in the sim: connect to VATSIM from the panel"); })
    .then(function () { return go("#cw-bubble", 900); })
    .then(function (b) { return clickBubble(b); })
    .then(function () { return goClick('.cw-tab[data-tab="vpilot"]', 700); })
    .then(function () { return wait(600); })
    .then(function () { return goClick("#cw-vp-conn", 700); })
    .then(function () { return wait(1600); })                              // your SimBrief plan is fetched
    .then(function () { return caption("<b>SB:</b> your latest SimBrief callsign, green when what you type matches"); })
    .then(function () { return fill("cw-vp-cs-in", "BAW117"); })
    .then(function () { return wait(1400); })
    .then(function () { return fill("cw-vp-type-in", "B77W"); })
    .then(function () { return api("selcal/generate", { callsign: "BAW117" }).then(function (r) { code = r.current.std.replace("-", ""); }); })
    .then(function () { return caption("Your <b>SELCAL</b> is checked on VATSIM as you type"); })
    .then(function () { return fill("cw-vp-selcal-in", code); })
    .then(function () { return wait(2800); })
    .then(function () { return goClick("#cw-vp-connect-go", 700); })
    .then(function () { return wait(2600); })
    .then(function () { return caption("Connected, but no flight plan filed yet: <b style=\"color:#ff7d7d\">FP status</b> shows a red cross"); })
    .then(function () { return go("#cw-fp-warn", 700); })
    .then(function () { return wait(2600); })
    .then(function () { return mockFp("filed"); })
    .then(function () { return caption("Flight plan filed on VATSIM: <b style=\"color:#4fd1a1\">FP status</b> turns green"); })
    .then(function () { return wait(2800); })
    .then(function () { return caption("<b>Nearby ATC</b>, with each controller's information"); })
    .then(function () { return goClick("[data-atc-toggle]", 800); })
    .then(function () { return wait(700); })
    .then(function () { return goClick('[data-atc="EGLL_TWR"]', 700); })
    .then(function () { return wait(1300); })
    .then(function () { return goClick('[data-atc="LON_S_CTR"]', 700); })
    .then(function () { return wait(2800); })
    .then(function () { return caption("The tower calls you on the frequency: answer from the panel"); })
    .then(function () { return goClick('.cw-chip-tab[data-chat="FREQ"]', 800); })
    .then(function () { return wait(500); })
    .then(function () { return radio("BAW117 start-up approved, QNH 1018, call Heathrow Ground 121.900 when ready"); })
    .then(function () { return wait(2400); })
    .then(function () { return goClick("#cw-vp-input", 600); })
    .then(function () { return type($("#cw-vp-input"), "Start-up approved, QNH 1018, BAW117", 17); })
    .then(function () { return goClick("#cw-vp-send", 500); })
    .then(function () { return wait(2400); })

    // ======== 2. CPDLC ========
    .then(function () { return caption("<b>CPDLC</b>: request the departure clearance by datalink"); })
    .then(function () { return goClick('.cw-tab[data-tab="cpdlc"]', 800); })
    .then(function () { return goClick("#cw-req-toggle"); })
    .then(function () { return goClick('#cw-req-kind2 [data-v="pdc"]'); })
    .then(function () { return fill("cw-f-station", "EGLL"); })
    .then(function () { return fill("cw-f-type", "B77W"); })
    .then(function () { return fill("cw-f-dep", "EGLL"); })
    .then(function () { return fill("cw-f-arr", "KJFK"); })
    .then(function () { return fill("cw-f-stand", "512"); })
    .then(function () { return fill("cw-f-atis", "C"); })
    .then(function () { return goClick("#cw-send", 500); })
    .then(function () { return goClick("#cw-req-toggle", 500); })
    .then(function () { return caption("The clearance arrives: tick it once read"); })
    .then(function () { return go("#cw-list .cw-tick", 800); })
    .then(function () { return wait(1600); })
    .then(function () { return click($("#cw-list .cw-tick")); })
    .then(function () { return wait(900); })
    .then(function () { return goClick("#cw-min", 700); })
    .then(function () { scene("cruise"); return caption("En route, logged on to <b>Shanwick</b> (EGGX)"); })
    .then(function () { return moveTo({ x: 700, y: 520 }, 900); })
    .then(function () { return wait(1000); })
    .then(function () {
      return api("logon", { station: "EGGX" }).then(function () { return wait(400); }).then(function () { return api("state?since=0"); })
        .then(function (s) {
          var acc = s.messages.filter(function (m) { return m.dir === "in" && /LOGON ACCEPTED/.test(m.text); });
          return Promise.all(acc.map(function (m) { return api("ack", { id: m.id }); }));
        });
    })
    .then(function () { return caption("A CPDLC clearance: the icon turns <b style=\"color:#f5b14c\">amber</b>. Answer it from the peek window"); })
    .then(function () { return wait(2400); })
    .then(function () { return go("#cw-bubble", 800); })
    .then(function (b) { return rightClick(b); })
    .then(function () { return wait(1700); })
    .then(function () { return go('#cw-peek [data-peek-reply="WILCO"]', 700); })
    .then(function (w) { mouse($("#cw-peek"), "mouseover"); return wait(500).then(function () { return click(w); }); })
    .then(function () { return wait(2000); })
    .then(function () { mouse($("#cw-peek"), "mouseout"); return moveTo({ x: 700, y: 560 }, 600); })
    .then(function () { return wait(1500); })
    .then(function () { return caption("Request your <b>oceanic clearance</b>"); })
    .then(function () { return go("#cw-bubble", 800); })
    .then(function (b) { return clickBubble(b); })
    .then(function () { return goClick("#cw-req-toggle"); })
    .then(function () { return goClick('#cw-req-kind2 [data-v="oceanic"]'); })
    .then(function () { return fill("cw-f-station", "EGGX"); })
    .then(function () { return fill("cw-f-entry", "DINIM"); })
    .then(function () { return fill("cw-f-eta", "1430"); })
    .then(function () { return fill("cw-f-mach", "84"); })
    .then(function () { return fill("cw-f-fl", "370"); })
    .then(function () { return goClick("#cw-send", 500); })
    .then(function () { return goClick("#cw-req-toggle", 500); })
    .then(function () { return caption("Oceanic clearance received"); })
    .then(function () { return wait(3800); })

    // ======== 3. SELCAL ========
    .then(function () { return caption("<b>SELCAL</b>: codes no one on VATSIM is using"); })
    .then(function () { return goClick('.cw-tab[data-tab="selcal"]', 700); })
    .then(function () { return fill("cw-sc-callsign", "BAW117"); })
    .then(function () { return goClick("#cw-sc-gen", 600); })
    .then(function () { return wait(1800); })
    .then(function () { return caption("Checked against every flight plan on VATSIM, then sent to vPilot's connect form"); })
    .then(function () { return goClick("#cw-sc-use", 700); })
    .then(function () { return wait(2400); })

    // ======== 4. Radar ========
    .then(function () { return caption("<b>Radar</b>: live VATSIM traffic, controllers and sectors"); })
    .then(function () { return goClick('.cw-tab[data-tab="radar"]', 700); })
    .then(function () { return wait(4200); })
    .then(function () { return caption("Click a plane for its full tag"); })
    .then(planeOnScreen)
    .then(function (p) { return p ? moveTo(p, 800).then(function () { return p; }) : null; })
    .then(mapClick)
    .then(function () { return wait(3300); })
    .then(function () { return goClick("#rd-cardx", 600); })
    .then(function () { return caption("Click a controlled airport for its controllers and ATIS"); })
    .then(atcOnScreen)
    .then(function (p) { return p ? moveTo(p, 800).then(function () { return p; }) : null; })
    .then(mapClick)
    .then(function () { return wait(3600); })
    .then(function () { return goClick("#rd-cardx", 600); })
    .then(function () { return caption("The target button centres the map on your aircraft"); })

function start() {
  placeCursor();
  var f = document.getElementById("panel");
  f.onload = function () {
    doc = f.contentDocument;
    installSim(f.contentWindow);
    waitFor("#cw-bubble").then(function () { return wait(2500); }).then(function () { window.__ready = true; return new Promise(function (r) { window.__go = r; }); })
      .then(flight)
      .then(function () { window.__done = true; }, function (e) { window.__error = String(e); window.__done = true; });
  };
  f.src = "/html_ui/InGamePanels/ClearwayPanel/ClearwayPanel.html?api=http://localhost:8797";
}
try {
  localStorage.setItem("CLEARWAY_POS", JSON.stringify({ x: 0.03, y: 0.25 }));
  localStorage.setItem("CLEARWAY_EXPANDED", "false");
  localStorage.setItem("CLEARWAY_TAB", JSON.stringify("vpilot"));
  localStorage.setItem("CLEARWAY_LOCK", "null");
  localStorage.setItem("CLEARWAY_PAUSED", "false");
  localStorage.removeItem("CLEARWAY_CHATS");
  localStorage.setItem("CLEARWAY_SC_SAVED", "false");
  localStorage.setItem("CLEARWAY_RADAR_DETACHED", "false");
  localStorage.setItem("radar.opts", JSON.stringify({ labels: true, atc: true, ground: true, depLines: true, arrLines: true, track: false, size: "auto" }));
  // ?rv=x,y,z: radar view chosen by record_demo.py, over the busiest traffic
  var rv = /[?&]rv=([\d.]+),([\d.]+),([\d.]+)/.exec(location.search);
  if (rv) localStorage.setItem("radar.view", JSON.stringify({ x: +rv[1], y: +rv[2], z: +rv[3] }));
} catch (e) { /* ignore */ }
start();
