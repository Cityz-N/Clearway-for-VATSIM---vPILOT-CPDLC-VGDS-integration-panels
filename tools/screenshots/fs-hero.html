<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 960px; height: 540px; overflow: hidden; font-family: "Segoe UI Variable", "Segoe UI", sans-serif; }
  body {
    position: relative;
    background:
      radial-gradient(ellipse 80% 55% at 60% 108%, rgba(255, 170, 90, .55), transparent 62%),
      linear-gradient(180deg, #0f2238 0%, #24466b 40%, #6b88a6 66%, #c9a27a 84%, #2b2a2e 85%, #17181c 100%);
  }
  .lights { position: absolute; left: 0; right: 0; top: 458px; height: 2px;
    background: repeating-linear-gradient(90deg, rgba(255, 220, 160, .9) 0 3px, transparent 3px 22px); opacity: .55; }
  .panel { position: absolute; left: 6px; top: 46px; width: 1000px; height: 1080px; border: 0; transform: scale(.82); transform-origin: 0 0; }
  .title { position: absolute; left: 30px; top: 18px; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
  .title b { font-size: 26px; letter-spacing: -.01em; }
  .title span { display: block; font-size: 13px; opacity: .85; margin-top: 2px; }
  .phones { position: absolute; right: 26px; top: 26px; display: flex; gap: 22px; }
  .phone { width: 234px; height: 506px; border-radius: 34px; padding: 7px; background: #05070b; box-shadow: 0 0 0 1.5px #2a3141, 0 22px 60px rgba(0,0,0,.55); position: relative; }
  .phone .clip { width: 234px; height: 506px; border-radius: 28px; overflow: hidden; }
  .phone iframe { width: 390px; height: 844px; border: 0; transform: scale(.6); transform-origin: 0 0; background: #0e1117; }
  .island { position: absolute; top: 13px; left: 50%; width: 66px; height: 18px; margin-left: -33px; background: #05070b; border-radius: 12px; z-index: 2; }
</style>
</head>
<body>
  <div class="lights"></div>
  <div class="title"><b>Clearway for VATSIM</b><span>CPDLC (Hoppie) and vPilot in MSFS and on your phone</span></div>
  <iframe class="panel" src="http://localhost:8791/html_ui/InGamePanels/ClearwayPanel/ClearwayPanel.html?api=http://localhost:8797&open=vpilot"></iframe>
  <div class="phones">
    <div class="phone"><div class="island"></div><div class="clip"><iframe src="http://localhost:8797/#tab=vpilot"></iframe></div></div>
    <div class="phone"><div class="island"></div><div class="clip"><iframe src="http://localhost:8797/#tab=cpdlc"></iframe></div></div>
  </div>
</body>
</html>
