<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 960px; height: 540px; overflow: hidden; font-family: "Segoe UI Variable", "Segoe UI", sans-serif; }
  body {
    position: relative;
    background:
      radial-gradient(ellipse 80% 55% at 40% 108%, rgba(255, 170, 90, .55), transparent 62%),
      linear-gradient(180deg, #0f2238 0%, #24466b 40%, #6b88a6 66%, #c9a27a 84%, #2b2a2e 85%, #17181c 100%);
  }
  .lights { position: absolute; left: 0; right: 0; top: 458px; height: 2px;
    background: repeating-linear-gradient(90deg, rgba(255, 220, 160, .9) 0 3px, transparent 3px 22px); opacity: .55; }
  .title { position: absolute; left: 28px; top: 16px; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
  .title b { font-size: 27px; letter-spacing: -.01em; }
  .title span { display: block; font-size: 13.5px; opacity: .9; margin-top: 2px; }
  /* radar card: 667x353 at (85,270) in the 1000x1080 panel; scale .86 puts it at (24,96) */
  .panel { position: absolute; left: -49px; top: -136px; width: 1000px; height: 1080px; border: 0; transform: scale(.86); transform-origin: 0 0; }
  .chips { position: absolute; left: 26px; top: 418px; display: flex; gap: 8px; }
  .chips span { padding: 6px 13px; border-radius: 16px; background: rgba(8, 12, 20, .72); color: #fff; font-size: 13.5px; font-weight: 600; border: 1px solid rgba(255,255,255,.14); }
  .chips span:nth-child(1) { color: #00d8d4; } .chips span:nth-child(2) { color: #f5b14c; } .chips span:nth-child(3) { color: #a99dff; } .chips span:nth-child(4) { color: #7fcf9f; }
  .phone { position: absolute; right: 30px; top: 17px; width: 234px; height: 506px; border-radius: 34px; padding: 7px; background: #05070b; box-shadow: 0 0 0 1.5px #2a3141, 0 22px 60px rgba(0,0,0,.55); }
  .phone .clip { width: 234px; height: 506px; border-radius: 28px; overflow: hidden; }
  .phone iframe { width: 390px; height: 844px; border: 0; transform: scale(.6); transform-origin: 0 0; background: #0e1117; }
  .island { position: absolute; top: 13px; left: 50%; width: 66px; height: 18px; margin-left: -33px; background: #05070b; border-radius: 12px; z-index: 2; }
</style>
</head>
<body>
  <div class="lights"></div>
  <div class="title"><b>Clearway for VATSIM</b><span>vPilot, CPDLC, SELCAL and a live radar, inside MSFS and on your phone</span></div>
  <iframe class="panel" src="http://localhost:8791/html_ui/InGamePanels/ClearwayPanel/ClearwayPanel.html?api=http://localhost:8797&open=radar"></iframe>
  <div class="chips"><span>vPilot</span><span>CPDLC</span><span>SELCAL</span><span>Radar</span></div>
  <div class="phone"><div class="island"></div><div class="clip"><iframe src="http://localhost:8797/#tab=vpilot"></iframe></div></div>
</body>
</html>
