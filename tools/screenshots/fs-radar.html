  body {
    position: relative;

  /* radar card: 667x353 at (85,270) in the 1000x1080 panel; scale 1.27 -> 847x448 at (56,66) */
  .panel { position: absolute; left: -52px; top: -277px; width: 1000px; height: 1080px; border: 0; transform: scale(1.27); transform-origin: 0 0; }
</style>
</head>
<body>
  <div class="title"><span>Radar</span> in the MSFS panel<small>Live VATSIM traffic with callsign, type and destination. Click a plane for its full tag. Detach it into its own window</small></div>
