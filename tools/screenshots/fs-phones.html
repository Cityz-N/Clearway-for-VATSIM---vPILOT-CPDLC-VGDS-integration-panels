<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 960px; height: 540px; overflow: hidden; font-family: "Segoe UI Variable", "Segoe UI", sans-serif; }
  body {
    display: flex; align-items: center; justify-content: center; gap: 34px;
    background: radial-gradient(ellipse 70% 60% at 50% 115%, rgba(0, 216, 212, .2), transparent 60%),
                linear-gradient(160deg, #16233a 0%, #0c111b 100%);
  }
  .phone { width: 234px; height: 506px; border-radius: 34px; padding: 7px; background: #05070b; box-shadow: 0 0 0 1.5px #2a3141, 0 22px 60px rgba(0,0,0,.55); position: relative; }
  .phone .clip { width: 234px; height: 506px; border-radius: 28px; overflow: hidden; }
  .phone iframe { width: 390px; height: 844px; border: 0; transform: scale(.6); transform-origin: 0 0; background: #0e1117; }
  .island { position: absolute; top: 13px; left: 50%; width: 66px; height: 18px; margin-left: -33px; background: #05070b; border-radius: 12px; z-index: 2; }
</style>
</head>
<body>
  <div class="phone"><div class="island"></div><div class="clip"><iframe src="http://localhost:8797/#tab=vpilot"></iframe></div></div>
  <div class="phone"><div class="island"></div><div class="clip"><iframe src="http://localhost:8797/#tab=cpdlc"></iframe></div></div>
  <div class="phone"><div class="island"></div><div class="clip"><iframe src="http://localhost:8797/#tab=notes"></iframe></div></div>
</body>
</html>
